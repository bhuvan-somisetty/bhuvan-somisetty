<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="55%" stop-color="#050506"/>
      <stop offset="100%" stop-color="#0b0304"/>
    </linearGradient>
    <radialGradient id="ambient" cx="80%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#ff1f3d" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ff1f3d" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurXS"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="blurS"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="blurM"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blurL"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowFrame"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="460" fill="url(#bgGrad)"/>
  <ellipse cx="960" cy="260" rx="380" ry="300" fill="url(#ambient)"/>

  <!-- ═══ circuit traces radiating from behind Tux ═══ -->
  <g stroke="#ff2b40" stroke-width="1.6" fill="none" opacity="0.55">
    <path d="M950 180 h-60 v-40 h-90"/>
    <path d="M950 180 h80 v-50 h60"/>
    <path d="M980 220 h100 v-20"/>
    <path d="M980 220 h-120 v30 h-70"/>
    <path d="M1000 260 h130"/>
    <path d="M1000 260 h-150 v40"/>
    <path d="M950 340 h-70 v40 h-60"/>
    <path d="M950 340 h90 v50 h70"/>
    <path d="M1020 300 h100 v-60"/>
    <path d="M1020 300 h-40 v70 h-90"/>
    <path d="M900 130 v-50 h-40"/>
    <path d="M1050 260 h60 v40"/>
  </g>
  <g fill="#ff2b40">
    <circle cx="800" cy="140" r="3.4"/><circle cx="800" cy="140" r="8" opacity="0.3" filter="url(#blurS)"/>
    <circle cx="1090" cy="130" r="3.4"/><circle cx="1090" cy="130" r="8" opacity="0.3" filter="url(#blurS)"/>
    <circle cx="1080" cy="200" r="3.4"/><circle cx="1080" cy="200" r="8" opacity="0.3" filter="url(#blurS)"/>
    <circle cx="790" cy="250" r="3.4"/><circle cx="790" cy="250" r="8" opacity="0.3" filter="url(#blurS)"/>
    <circle cx="1130" cy="260" r="3.4"/><circle cx="1130" cy="260" r="8" opacity="0.3" filter="url(#blurS)"/>
    <circle cx="850" cy="300" r="3.4"/><circle cx="850" cy="300" r="8" opacity="0.3" filter="url(#blurS)"/>
    <circle cx="820" cy="380" r="3.4"/><circle cx="820" cy="380" r="8" opacity="0.3" filter="url(#blurS)"/>
    <circle cx="1110" cy="390" r="3.4"/><circle cx="1110" cy="390" r="8" opacity="0.3" filter="url(#blurS)"/>
    <circle cx="1120" cy="240" r="3.4"/><circle cx="1120" cy="240" r="8" opacity="0.3" filter="url(#blurS)"/>
    <circle cx="890" cy="370" r="3.4"/><circle cx="890" cy="370" r="8" opacity="0.3" filter="url(#blurS)"/>
    <circle cx="860" cy="80" r="3.4"/><circle cx="860" cy="80" r="8" opacity="0.3" filter="url(#blurS)"/>
    <circle cx="1110" cy="300" r="3.4"/><circle cx="1110" cy="300" r="8" opacity="0.3" filter="url(#blurS)"/>
    <circle cx="950" cy="180" r="2.6" opacity="0.8"/>
    <circle cx="980" cy="220" r="2.6" opacity="0.8"/>
    <circle cx="1000" cy="260" r="2.6" opacity="0.8"/>
    <circle cx="950" cy="340" r="2.6" opacity="0.8"/>
    <circle cx="1020" cy="300" r="2.6" opacity="0.8"/>
  </g>

  <!-- ═══ headline ═══ -->
  <g font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-weight="800">
    <text x="60" y="192" font-size="46" fill="#f5f5f5" letter-spacing="0.5">BUILDING OPEN SOURCE.</text>
    <text x="60" y="248" font-size="46" fill="#ff2b40" letter-spacing="0.5">EMPOWERING THE FUTURE.</text>
  </g>
  <text x="60" y="288" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="18" fill="#a3a3a3">
    Passionate about Linux &#8226; Cloud Native &#8226; AI/ML &#8226; Developer Experience
  </text>
  <text x="60" y="335" font-family="Arial, 'Segoe UI', Helvetica, sans-serif" font-size="13" fill="#6b6b6b" letter-spacing="0.5">
    CONTRIBUTING TO KUBERNETES &#8226; KYVERNO &#8226; KUBEEDGE &#8226; OPENTELEMETRY
  </text>

  <!-- ═══ ground energy rings under Tux ═══ -->
  <g stroke="#ff2b40" fill="none">
    <ellipse cx="950" cy="430" rx="150" ry="14" opacity="0.45" stroke-width="1.4"/>
    <ellipse cx="950" cy="430" rx="200" ry="18" opacity="0.22" stroke-width="1.2"/>
    <ellipse cx="950" cy="430" rx="250" ry="22" opacity="0.10" stroke-width="1"/>
  </g>

  <!-- ═══ TUX ═══ -->
  <g transform="translate(760,8) scale(0.78)">
    <!-- rim glow pass (behind, blurred, larger) -->
    <path d="M250 40 C 160 40 90 120 90 220 C 90 320 110 380 140 415 C 170 445 210 460 250 460
             C 290 460 330 445 360 415 C 390 380 410 320 410 220 C 410 120 340 40 250 40 Z"
          fill="none" stroke="#ff2b40" stroke-width="14" opacity="0.55" filter="url(#blurL)"/>

    <!-- body silhouette -->
    <path d="M250 40 C 160 40 90 120 90 220 C 90 320 110 380 140 415 C 170 445 210 460 250 460
             C 290 460 330 445 360 415 C 390 380 410 320 410 220 C 410 120 340 40 250 40 Z"
          fill="#08080a"/>
    <path d="M250 40 C 160 40 90 120 90 220 C 90 320 110 380 140 415 C 170 445 210 460 250 460
             C 290 460 330 445 360 415 C 390 380 410 320 410 220 C 410 120 340 40 250 40 Z"
          fill="none" stroke="#ff2b40" stroke-width="3.5"/>

    <!-- arms -->
    <path d="M108 260 C 68 292 62 350 88 392 C 104 356 108 300 124 264 Z" fill="#08080a" stroke="#ff2b40" stroke-width="2.6"/>
    <path d="M392 260 C 432 292 438 350 412 392 C 396 356 392 300 376 264 Z" fill="#08080a" stroke="#ff2b40" stroke-width="2.6"/>

    <!-- feet (glowing) -->
    <g filter="url(#blurXS)">
      <path d="M120 428 C 90 438 70 468 82 500 C 94 530 148 544 186 534 C 216 526 228 498 216 468 C 204 442 168 422 120 428 Z" fill="#ff2b40"/>
      <path d="M380 428 C 410 438 430 468 418 500 C 406 530 352 544 314 534 C 284 526 272 498 284 468 C 296 442 332 422 380 428 Z" fill="#ff2b40"/>
    </g>
    <path d="M120 428 C 90 438 70 468 82 500 C 94 530 148 544 186 534 C 216 526 228 498 216 468 C 204 442 168 422 120 428 Z" fill="none" stroke="#ff6a70" stroke-width="1.5" opacity="0.7"/>
    <path d="M380 428 C 410 438 430 468 418 500 C 406 530 352 544 314 534 C 284 526 272 498 284 468 C 296 442 332 422 380 428 Z" fill="none" stroke="#ff6a70" stroke-width="1.5" opacity="0.7"/>

    <!-- face -->
    <ellipse cx="190" cy="150" rx="27" ry="33" fill="#f5f5f5"/>
    <ellipse cx="310" cy="150" rx="27" ry="33" fill="#f5f5f5"/>
    <circle cx="196" cy="160" r="12.5" fill="#08080a"/>
    <circle cx="316" cy="160" r="12.5" fill="#08080a"/>
    <circle cx="200" cy="155" r="3.2" fill="#ffffff"/>
    <circle cx="320" cy="155" r="3.2" fill="#ffffff"/>
    <path d="M212 208 Q250 226 288 208" fill="none" stroke="#ff2b40" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ═══ premium red frame ═══ -->
  <rect x="6" y="6" width="1188" height="448" rx="14" fill="none" stroke="#ff2b40" stroke-width="7" opacity="0.22" filter="url(#glowFrame)"/>
  <rect x="6" y="6" width="1188" height="448" rx="14" fill="none" stroke="#ff2b40" stroke-width="2.2"/>

  <!-- corner tick accents -->
  <g stroke="#ff2b40" stroke-width="5" opacity="0.9">
    <line x1="1128" y1="34" x2="1148" y2="14"/>
    <line x1="1140" y1="34" x2="1160" y2="14"/>
    <line x1="1152" y1="34" x2="1172" y2="14"/>
    <line x1="1164" y1="34" x2="1184" y2="14"/>
  </g>
  <g stroke="#ff2b40" stroke-width="5" opacity="0.9">
    <line x1="16" y1="446" x2="36" y2="426"/>
    <line x1="28" y1="446" x2="48" y2="426"/>
    <line x1="40" y1="446" x2="60" y2="426"/>
    <line x1="52" y1="446" x2="72" y2="426"/>
  </g>
</svg>
