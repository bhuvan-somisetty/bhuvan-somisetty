<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#ff1f3d" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ff1f3d" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff1f3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1f"/>
      <stop offset="55%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>
    <linearGradient id="bellyFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="footFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3b4e"/>
      <stop offset="100%" stop-color="#8c0f1c"/>
    </linearGradient>
    <filter id="rimBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="circuit" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 30 H20 V10 H45 V30 H60 M30 0 V20 H50 V60" fill="none" stroke="#ff1f3d" stroke-width="1" opacity="0.18"/>
      <circle cx="20" cy="10" r="1.6" fill="#ff1f3d" opacity="0.3"/>
      <circle cx="45" cy="30" r="1.6" fill="#ff1f3d" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="520" height="520" fill="#050506"/>
  <rect width="520" height="520" fill="url(#circuit)"/>
  <circle cx="260" cy="250" r="230" fill="url(#glow)">
    <animate attributeName="r" values="220;236;220" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#rimBlur)">
    <!-- feet -->
    <ellipse cx="205" cy="452" rx="34" ry="14" fill="url(#footFill)"/>
    <ellipse cx="315" cy="452" rx="34" ry="14" fill="url(#footFill)"/>

    <!-- body -->
    <path d="M260 70
             C 175 70 130 165 130 265
             C 130 375 175 445 260 445
             C 345 445 390 375 390 265
             C 390 165 345 70 260 70 Z"
          fill="url(#bodyFill)" stroke="#ff2b40" stroke-width="2.4" opacity="0.98"/>

    <!-- belly -->
    <path d="M260 150
             C 210 150 182 210 182 280
             C 182 360 213 405 260 405
             C 307 405 338 360 338 280
             C 338 210 310 150 260 150 Z"
          fill="url(#bellyFill)" stroke="#ff2b40" stroke-width="1" opacity="0.9"/>

    <!-- wings -->
    <path d="M132 210 C 95 240 88 320 118 380 C 130 340 132 270 150 230 Z" fill="url(#bodyFill)" stroke="#ff2b40" stroke-width="1.6"/>
    <path d="M388 210 C 425 240 432 320 402 380 C 390 340 388 270 370 230 Z" fill="url(#bodyFill)" stroke="#ff2b40" stroke-width="1.6"/>

    <!-- beak -->
    <path d="M232 245 L288 245 L260 275 Z" fill="#ff8a3d" stroke="#7a2600" stroke-width="1"/>

    <!-- eyes -->
    <ellipse cx="222" cy="205" rx="16" ry="20" fill="#f4f4f4"/>
    <ellipse cx="298" cy="205" rx="16" ry="20" fill="#f4f4f4"/>
    <circle cx="225" cy="210" r="7" fill="#050506"/>
    <circle cx="301" cy="210" r="7" fill="#050506"/>
    <circle cx="227" cy="207" r="2" fill="#ffffff"/>
    <circle cx="303" cy="207" r="2" fill="#ffffff"/>
  </g>

  <!-- rim light accent stroke, animated pulse -->
  <path d="M260 70
           C 175 70 130 165 130 265
           C 130 375 175 445 260 445
           C 345 445 390 375 390 265
           C 390 165 345 70 260 70 Z"
        fill="none" stroke="#ff3b4e" stroke-width="1.4" opacity="0.55" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="3.6s" repeatCount="indefinite"/>
  </path>
</svg>
